name: Build and Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: iagoprolg/cloud-services-week6-backend:${{ github.sha }}

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/oc

      - name: Log in to Rahti
        run: |
          oc login "${{ secrets.RAHTI_SERVER }}" --token="${{ secrets.RAHTI_TOKEN }}"

      - name: Deploy new backend image
        run: |
          oc project cloud-services-week4-iago
          oc set image deployment/backend backend=iagoprolg/cloud-services-week6-backend:${{ github.sha }}
          oc rollout status deployment/backend --timeout=180s
